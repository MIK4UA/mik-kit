# MIK static site behind Cloudflare → Traefik (Coolify). Template from mik-kit — copy into the product,
# keep the two includes. The include file is generated in the Docker build (mik-kit nginx-headers).
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Real visitor IP for rate limits (Cloudflare → Traefik → here)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;
    # /ru → /ru/ must stay on the public https host behind Traefik
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Headers + CSP for every response. Repeat this include in EVERY location that has its own add_header:
    # nginx drops server-level add_header there.
    include /etc/nginx/snippets/mik-security.conf;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|svg)$ {
        include /etc/nginx/snippets/mik-security.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        access_log off;
    }

    # Each language has its own index.html: / (uk), /ru/, /en/
    location / {
        include /etc/nginx/snippets/mik-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
